name: Build Biodanza Windows Setup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and patch index.html
        shell: pwsh
        run: |
          $parts = @(
            "src-archive/index.html.gz.b64.part01",
            "src-archive/index.html.gz.b64.part02",
            "src-archive/index.html.gz.b64.part03",
            "src-archive/index.html.gz.b64.part04"
          )
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          $gzPath = Join-Path $PWD "index.html.gz"
          [IO.File]::WriteAllBytes($gzPath, [Convert]::FromBase64String($b64))
          $in = [IO.File]::OpenRead($gzPath)
          $out = [IO.File]::Create((Join-Path $PWD "index.html"))
          $gzip = New-Object IO.Compression.GzipStream($in, [IO.Compression.CompressionMode]::Decompress)
          $gzip.CopyTo($out)
          $gzip.Dispose(); $out.Dispose(); $in.Dispose()
          if (-not (Test-Path index.html)) { throw "index.html reconstruction failed" }

          $html = Get-Content index.html -Raw
          $marker = "`n`nlet audioCtx,sourceNode,compressor;"
          $folderFix = @'

// Electron folder controls — early binding safety net (5.4.1)
if (IS_ELECTRON) {
  const chooseBtnEarly = $('choosePersistentFolder');
  const reopenBtnEarly = $('reopenPreviousFolder');

  if (chooseBtnEarly) {
    chooseBtnEarly.addEventListener('click', async (ev) => {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      try {
        $('loadStatus').textContent = 'פותח חלון לבחירת תיקיית מוזיקה…';
        if (!window.electronAPI?.chooseMusicFolder) throw new Error('Electron bridge is unavailable');
        const payload = await window.electronAPI.chooseMusicFolder();
        if (payload?.canceled) {
          $('loadStatus').textContent = 'בחירת התיקייה בוטלה.';
          return;
        }
        loadElectronLibrary(payload);
      } catch (err) {
        console.error('chooseMusicFolder failed', err);
        $('loadStatus').textContent = 'שגיאה בפתיחת תיקיית המוזיקה.';
        alert('לא ניתן לפתוח את חלון בחירת התיקייה.\n\n' + (err?.message || err));
      }
    }, true);
  }

  if (reopenBtnEarly) {
    reopenBtnEarly.disabled = false;
    reopenBtnEarly.addEventListener('click', async (ev) => {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      try {
        $('loadStatus').textContent = 'פותח את תיקיית המוזיקה הקודמת…';
        if (!window.electronAPI?.reopenMusicFolder) throw new Error('Electron bridge is unavailable');
        const payload = await window.electronAPI.reopenMusicFolder();
        loadElectronLibrary(payload);
      } catch (err) {
        console.error('reopenMusicFolder failed', err);
        $('loadStatus').textContent = 'שגיאה בפתיחת התיקייה הקודמת.';
        alert('לא ניתן לפתוח את תיקיית המוזיקה הקודמת.\n\n' + (err?.message || err));
      }
    }, true);
  }
}
'@
          if ($html -notmatch 'early binding safety net') {
            if (-not $html.Contains($marker)) { throw "Folder-fix insertion marker not found" }
            $html = $html.Replace($marker, $folderFix + $marker)
          }
          if ($html -notmatch 'language-update\.js') {
            $html = $html -replace '</body>', '<script src="language-update.js"></script></body>'
          }
          if ($html -notmatch 'relink-upgrade\.js') {
            $html = $html -replace '</body>', '<script src="relink-upgrade.js"></script></body>'
          }
          Set-Content index.html -Value $html -Encoding UTF8
          Write-Host "index.html size: $((Get-Item index.html).Length)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check main.js
          node --check preload.js
          node --check language-update.js
          node --check relink-upgrade.js

      - name: Build Windows Setup
        run: npm run build:setup

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "Biodanza Music Player Setup 5.4.1.exe" -File | Select-Object -First 1
          if (-not $setup) { throw "Setup EXE was not created" }
          Write-Host "Created: $($setup.FullName)"

      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: Biodanza-Music-Player-Setup-5.4.1
          path: dist/Biodanza Music Player Setup 5.4.1.exe
