name: Build Biodanza Windows Setup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and patch index.html
        shell: pwsh
        run: |
          $parts = @(
            "src-archive/index.html.gz.b64.part01",
            "src-archive/index.html.gz.b64.part02",
            "src-archive/index.html.gz.b64.part03",
            "src-archive/index.html.gz.b64.part04"
          )
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          $gzPath = Join-Path $PWD "index.html.gz"
          [IO.File]::WriteAllBytes($gzPath, [Convert]::FromBase64String($b64))
          $in = [IO.File]::OpenRead($gzPath)
          $out = [IO.File]::Create((Join-Path $PWD "index.html"))
          $gzip = New-Object IO.Compression.GzipStream($in, [IO.Compression.CompressionMode]::Decompress)
          $gzip.CopyTo($out)
          $gzip.Dispose(); $out.Dispose(); $in.Dispose()
          if (-not (Test-Path index.html)) { throw "index.html reconstruction failed" }

          $html = Get-Content index.html -Raw

          # Export the Electron library loader for folder-controls.js.
          $endNeedle = "const DIR_DB='biodanzaDirectoryDB';"
          if (-not $html.Contains($endNeedle)) { throw "DIR_DB marker not found" }
          if ($html -notmatch '__biodanzaLoadElectronLibrary') {
            $html = $html.Replace($endNeedle, "window.__biodanzaLoadElectronLibrary=loadElectronLibrary;`n" + $endNeedle)
          }

          # Make workspace switching explicit and independent of conflicting CSS.
          $mainLine = " $('mainWorkspace').classList.toggle('hidden',name!=='main');"
          $mainReplacement = @"
 $('mainWorkspace').classList.toggle('hidden',name!=='main');
 $('mainWorkspace').style.setProperty('display',name==='main'?'block':'none','important');
 $('activeWorkspace').classList.toggle('hidden',name!=='active');
 $('activeWorkspace').style.setProperty('display',name==='active'?'block':'none','important');
"@
          if (-not $html.Contains($mainLine)) { throw "switchWorkspace main line not found" }
          $html = $html.Replace($mainLine, $mainReplacement.TrimEnd())

          $exportLine = " $('exportWorkspace').classList.toggle('hidden',name!=='export');"
          $exportReplacement = @"
 $('exportWorkspace').classList.toggle('hidden',name!=='export');
 $('exportWorkspace').style.setProperty('display',name==='export'?'block':'none','important');
"@
          $html = $html.Replace($exportLine, $exportReplacement.TrimEnd())

          $advancedLine = " $('advancedWorkspace').classList.toggle('hidden',name!=='advanced');"
          $advancedReplacement = @"
 $('advancedWorkspace').classList.toggle('hidden',name!=='advanced');
 $('advancedWorkspace').style.setProperty('display',name==='advanced'?'block':'none','important');
"@
          $html = $html.Replace($advancedLine, $advancedReplacement.TrimEnd())

          # Insert the relink feature INSIDE the main IIFE so it can access state, ann(), probeDurations(), etc.
          $lastClose = $html.LastIndexOf('})();')
          $scriptEnd = $html.IndexOf('</script>', $lastClose)
          if ($lastClose -lt 0 -or $scriptEnd -lt 0) { throw "Final IIFE/script boundary not found" }

          $relink = Get-Content relink-upgrade.js -Raw
          $relink = $relink.Replace("const headerToolbar = document.querySelector('#topCard header .toolbar');", "const headerToolbar = document.querySelector('#advancedHost') || document.querySelector('#topCard header .toolbar');")
          $relink = $relink.Replace("const topCard = `$id('topCard');", "const topCard = `$id('advancedHost') || `$id('topCard');")
          $relink = $relink.Replace("importLabel.textContent = '📥 ייבא חבילת העברה';", "importLabel.textContent = '📥 ייבא חבילת העברה ושייך מחדש';")
          $relink = $relink.Replace("appVersion:'5.4.0'", "appVersion:'5.4.6'")
          $relink = $relink.Replace("window.probeDurations = async function(){", "probeDurations = async function(){")
          $html = $html.Substring(0,$lastClose) + "`n// ---- transfer and relink feature ----`n" + $relink + "`n" + $html.Substring($lastClose)

          # Remove the old broken tail after the main IIFE and add a safe Electron-only hint.
          $lastClose = $html.LastIndexOf('})();')
          $scriptEnd = $html.IndexOf('</script>', $lastClose)
          if ($lastClose -lt 0 -or $scriptEnd -lt 0) { throw "Final IIFE/script boundary not found after relink injection" }
          $safeTailB64 = ""
          $safeTail = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($safeTailB64))
          $prefix = $html.Substring(0, $lastClose + 5)
          $suffix = $html.Substring($scriptEnd)
          $html = $prefix + $safeTail + $suffix

          # Strong visibility guard.
          $headEnd = $html.LastIndexOf('</head>')
          if ($headEnd -lt 0) { throw "Final head tag not found" }
          $workspaceCss = '<style id="workspaceVisibilityFix">#mainWorkspace.hidden,#activeWorkspace.hidden,#exportWorkspace.hidden,#advancedWorkspace.hidden{display:none!important}</style>'
          $html = $html.Substring(0, $headEnd) + $workspaceCss + $html.Substring($headEnd)

          # External helpers; relink-upgrade is already injected inside the main scope.
          $bodyEnd = $html.LastIndexOf('</body>')
          if ($bodyEnd -lt 0) { throw "Final body tag not found" }
          $inject = '<script src="folder-controls.js"></script><script src="language-update.js"></script>'
          $html = $html.Substring(0, $bodyEnd) + $inject + $html.Substring($bodyEnd)

          # Extract and syntax-check the exact main renderer script.
          $scriptStart = $html.IndexOf('<script>')
          $scriptClose = $html.IndexOf('</script>', $scriptStart)
          if ($scriptStart -lt 0 -or $scriptClose -lt 0) { throw "Main inline script not found" }
          $inlineJs = $html.Substring($scriptStart + 8, $scriptClose - ($scriptStart + 8))
          Set-Content inline-main.js -Value $inlineJs -Encoding UTF8
          Set-Content index.html -Value $html -Encoding UTF8
          Write-Host "index.html size: $((Get-Item index.html).Length)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check main.js
          node --check preload.js
          node --check folder-controls.js
          node --check language-update.js
          node --check relink-upgrade.js
          node --check inline-main.js

      - name: Verify patched index markers
        shell: pwsh
        run: |
          $html = Get-Content index.html -Raw
          if ($html -notmatch '__biodanzaLoadElectronLibrary=loadElectronLibrary') { throw "Electron library loader was not exported" }
          if ($html -notmatch "activeWorkspace.*name==='active'") { throw "Active workspace switch fix missing" }
          if ($html -notmatch 'exportTransferPackage') { throw "Transfer package UI missing" }
          if ($html -notmatch 'ייבא חבילת העברה ושייך מחדש') { throw "Relink import button missing" }
          if ($html -match '<script src="relink-upgrade.js"></script>') { throw "Relink script must not be external" }
          if (($html | Select-String -Pattern '<script src="folder-controls.js"></script>' -AllMatches).Matches.Count -ne 1) { throw "folder-controls injection count is not 1" }
          if (($html | Select-String -Pattern '<script src="language-update.js"></script>' -AllMatches).Matches.Count -ne 1) { throw "language-update injection count is not 1" }

      - name: Build Windows Setup
        run: npm run build:setup

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "Biodanza Music Player Setup 5.4.6.exe" -File | Select-Object -First 1
          if (-not $setup) { throw "Setup EXE was not created" }
          Write-Host "Created: $($setup.FullName)"

      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: Biodanza-Music-Player-Setup-5.4.6
          path: dist/Biodanza Music Player Setup 5.4.6.exe
          if-no-files-found: error
